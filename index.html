/* ---------------- 项目对象 ---------------- */
function colorForName(s){
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return TAG_PALETTE[h%TAG_PALETTE.length];
}
function projLabelId(p){ return 'proj_'+p.key; }
/* 项目显示名：
   目录模式 → 子目录名（天然正确，agent 也靠它定位）
   文件模式 → 拿不到父目录名（FileSystemFileHandle 没有 parent）→ 退回工单标题，再退回文件名
   重名自动加后缀，避免多个 board.json 全叫 "board" */
function pickProjectName(base,used){
  let name=String(base||'').trim()||'未命名项目';
  if(!used[name]) return name;
  let i=2;
  while(used[name+' ('+i+')']) i++;
  return name+' ('+i+')';
}
/* 项目对象：
   key  = 路径标识（目录模式下=子目录名，agent 的 take.ps1 靠它定位，不能随便改）
   name = 显示名（取工单标题；用户重命名时写回 title，所以能持久） */
function makeProject(key,defName,fileHandle,data,dirH){
  const t=(data&&data.title&&data.title!=='Aurora Board')?String(data.title):defName;
  return {key:key,name:t,color:colorForName(key),fileHandle:fileHandle,dirHandle:dirH||null,
          data:data,rev:Number(data&&data.rev)||0};
}
function countReview(p){
  let n=0;
  ((p.data&&p.data.lists)||[]).forEach(l=>l.cards.forEach(c=>{ if(statusOf(c)==='review') n++; }));
  return n;
}
/* 聚合视图：所有项目的卡片按状态分四列，卡片带项目标签区分来源 */
function buildAggregate(){
  const lists=STATUS_KEYS.map(k=>({id:'agg_'+k,title:STATUSES[k].name,color:STATUSES[k].color,cards:[]}));
  const aggLabels=[],seen={};
  projects.forEach(p=>{
    ((p.data&&p.data.lists)||[]).forEach(l=>(l.cards||[]).forEach(c=>{
      const t=lists.find(x=>x.id==='agg_'+statusOf(c));
      if(!t) return;
      const cc=Object.assign({},c);
      cc.labels=(c.labels||[]).concat([projLabelId(p)]);
      cc.__proj=p.key;          // 供编辑操作定位卡片所属项目
      t.cards.push(cc);
    }));
    ((p.data&&p.data.labels)||[]).forEach(l=>{
      if(!seen['L'+l.id]){ seen['L'+l.id]=1; aggLabels.push(Object.assign({},l)); }
    });
  });
  projects.forEach(p=>aggLabels.push({id:projLabelId(p),name:p.name,color:p.color}));
  return {title:'全部项目',lists:lists,labels:aggLabels,images:{},rev:0};
}
/* 切换当前视图：key = 项目 key 或 '__all__' */
function switchTo(key){
  if(key===curKey) return;
  curKey=key;
  if(key==='__all__'){
    aggBoard=buildAggregate();
    board=aggBoard;
    labels=aggBoard.labels;
  }else{
    const p=projects.find(x=>x.key===key);
    if(!p) return;
    board=p.data;
    labels=p.data.labels||(p.data.labels=[]);
  }
  renderAll();
  renderProjSwitch();
}
/** 外部数据变化后刷新当前视图 */
function refreshCurrentView(){
  if(curKey==='__all__'){
    aggBoard=buildAggregate();
    board=aggBoard;
    labels=aggBoard.labels;
  }else{
    const p=curProject();
    if(p){ board=p.data; labels=p.data.labels||(p.data.labels=[]); }
  }
  renderAll();
  renderProjSwitch();
}
/** 顶栏项目切换器：全部项目 + 各项目（带待复查数） */
function renderProjSwitch(){
  const box=$('#projSwitch');
  if(!box) return;
  box.innerHTML='';
  if(!projects.length){ box.style.display='none'; return; }
  box.style.display='flex';
  const all=el('button','pc'+(curKey==='__all__'?' on':''),'全部项目');
  all.title='所有项目的汇总（只读），按状态分列';
  all.addEventListener('click',()=>switchTo('__all__'));
  box.appendChild(all);
  projects.forEach(p=>{
    const n=countReview(p);
    const b=el('button','pc'+(curKey===p.key?' on':''),p.name+(n?' · '+n:''));
    b.title=p.name+'（待复查 '+n+'）';
    b.addEventListener('click',()=>switchTo(p.key));
    box.appendChild(b);
  });
}
/** 构造完整数据（看板 + 标签 + 内联图片），供导出与写盘共用 */
async function buildPayload(b){
  const src=b||board;
  const imgs={};
  for(const id of collectImageIds(src)){
    let d=imgCache.get(id);
    if(!d){ try{ const rec=await idbGet(id); d=rec&&rec.data; }catch(e){} }
    if(d) imgs[id]=d;
  }
  return Object.assign({},src,{app:'aurora-board',version:1,updatedAt:new Date().toISOString(),labels:(src.labels||labels),images:imgs});
}
/** 把一份外部数据应用到指定看板（不传则应用��当前 board） */
async function applyFileData(d,target){
  const t=target||board;
  const lab=Array.isArray(d.labels)&&d.labels.length
    ? d.labels.filter(x=>x&&x.id).map(x=>({
        id:String(x.id),
        name:String(x.name||x.id),
        color:/^#[0-9a-fA-F]{6}$/.test(x.color)?x.color:'#7d879c'
      }))
    : null;
  if(d.images&&typeof d.images==='object'){
    for(const k of Object.keys(d.images)){
      const data=d.images[k];
      if(typeof data!=='string'||!data) continue;
      const mime=(/^data:([^;]+)/.exec(data)||[])[1]||'image/jpeg';
      try{ await idbPut(k,{mime:mime,data:data}); }catch(e){}
      imgCache.set(k,data);
    }
  }
  const nd=Object.assign({},d);
  delete nd.labels; delete nd.images; delete nd.rev; delete nd.updatedAt; delete nd.app; delete nd.version;
  t.title=nd.title||'Aurora Board';
  t.lists=nd.lists||[];
  if(lab) t.labels=lab;
  pruneDanglingLabels(t);
  normalizeStatus(t);
  return t;
}
function renderAll(){
  renderBoard(); renderStats(); renderStatusChips(); renderFilterChips(); applyFilter();
}
/* 写入：只写指定项目，聚合视图不写 */
async function writeFile(p){
  if(!p||!p.fileHandle||!fileSyncOn) return;
  try{
    await backupProject(p);
    const payload=await buildPayload(p.data);
    payload.rev=(Number(p.rev)||0)+1;
    const w=await p.fileHandle.createWritable();
    await w.write(JSON.stringify(payload,null,2));
    await w.close();
    p.rev=payload.rev; p.data.rev=p.rev;
    renderFileStatus();
  }catch(e){
    toast('写入文件失败：'+((e&&e.message)||'未知错误'));
  }
}
function scheduleFileWrite(p){
  if(!fileSyncOn||!p) return;
  clearTimeout(fileWriteTimer);
  fileWriteTimer=setTimeout(()=>writeFile(p),800);
}
/* 工单目录不做版本管理 → 每次写入前把上一版存进 IndexedDB，误删可回滚 */
async function backupProject(p){
  try{ await metaSet('backup_'+p.key,JSON.stringify(p.data)); }catch(e){}
}
async function restoreBackup(p){
  if(!p) return;
  try{
    const raw=await metaGet('backup_'+p.key);
    if(!raw){ toast('没有可恢复的备份'); return; }
    const d=JSON.parse(raw);
    await applyFileData(d,p.data);
    p.rev=Number(d.rev)||0;
    save(); refreshCurrentView();
    toast('已恢复到上一版');
  }catch(e){ toast('恢复失败：'+((e&&e.message)||'未知错误')); }
}
/* 读取：逐个项目比对 rev，只有外部更新的才覆盖 */
async function readProjects(){
  if(!fileSyncOn) return false;
  let changed=false;
  for(const p of projects){
    try{
      const f=await p.fileHandle.getFile();
      if(!f.size) continue;
      const d=JSON.parse(await f.text());
      if(!d||!Array.isArray(d.lists)) continue;
      const rev=Number(d.rev)||0;
      if(rev<=p.rev) continue;          // 本地更新，不覆盖
      await applyFileData(d,p.data);
      p.rev=rev;
      changed=true;
    }catch(e){}
  }
  if(changed){ refreshCurrentView(); toast('已同步外部更新'); }
  return changed;
}
function renderFileStatus(){
  const tip=$('#syncTip');
  if(!tip) return;
  if(fileSyncOn&&projects.length){
    const n=projects.length;
    tip.textContent='⇄ '+(dirHandle?dirHandle.name:n+' 个文件');

      : ('⚠️ 文件模式：只保证面板侧同步。\nAgent 的取件脚本按「工单根目录\\<项目名>\\board.json」定位，'
         +'这里的文件它找不到。\n要跑通 agent 工单流，请改用「选择工单根目录」或「新建工单项目」。');
  }else if(pendingDir||pendingHandle){

    tip.textContent='';

}
/* 扫描：目录模式取子目录的 board.json；文件模式取选中的文件 */
async function scanProjects(){
  const ps=[];
  if(dirHandle){
    try{
      for await (const [name,handle] of dirHandle.entries()){
        if(handle.kind!=='directory') continue;
        try{
          const fh=await handle.getFileHandle('board.json');
          const f=await fh.getFile();
          if(!f.size) continue;
          const d=JSON.parse(await f.text());
          if(!d||!Array.isArray(d.lists)) continue;
          ps.push(makeProject(name,name,fh,d,handle));
        }catch(e){}
      }
    }catch(e){}
  }else if(fileHandles.length){
    for(const fh of fileHandles){
      try{
        const f=await fh.getFile();
        if(!f.size) continue;
        const d=JSON.parse(await f.text());
        if(!d||!Array.isArray(d.lists)) continue;
        const def=fh.name.replace(/\.json$/i,'');
        ps.push(makeProject(def,def,fh,d,null));
      }catch(e){}
    }
  }
  // 显示名去重：多个 board.json 同名时加后缀，避免切换器里全是 "board"
  const used={};
  ps.forEach(p=>{ p.name=pickProjectName(p.name,used); used[p.name]=1; });
  projects=ps;
  if(curKey!=='__all__'&&!projects.some(p=>p.key===curKey)) curKey='__all__';
  refreshCurrentView();
  renderProjSwitch();
  renderFileStatus();
}
async function connectDirectory(dir){
  dirHandle=dir; fileHandles=[]; pendingDir=null; pendingHandle=null;
  try{ await metaSet(DIR_HANDLE_KEY,dir); await metaSet(FILE_HANDLE_KEY,null); }catch(e){}
  fileSyncOn=true;
  try{ if(!localStorage.getItem(ROOT_PATH_KEY)) askBoardsRoot(); }catch(e){}
  await writeTakeScript();
  await scanProjects();
  toast('已连接工单目录：'+dir.name+'（'+projects.length+' 个项目）');
}
async function connectFiles(list){
  fileHandles=list.slice(); dirHandle=null; pendingHandle=null; pendingDir=null;
  try{ await metaSet(FILE_HANDLE_KEY,list.length===1?list[0]:list); await metaSet(DIR_HANDLE_KEY,null); }catch(e){}
  fileSyncOn=true;
  await scanProjects();
  toast('已连接 '+projects.length+' 个工单文件');
}
async function pickDirectory(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持目录选择，请用「选择工单文件（可多选）」'); return; }
  try{
    const d=await window.showDirectoryPicker({mode:'readwrite'});
    await connectDirectory(d);
  }catch(e){ if(e&&e.name!=='AbortError') toast('连接失败：'+((e&&e.message)||'未知错误')); }

    await connectFiles([h]);

}
/** agent 取件脚本：放在工单根目录，用 $PSScriptRoot 自定位；项目名默认取当前目录名 */
const TAKE_PS1=[
'\uFEFF# Aurora Board 取件脚本',
'# ⚠️ 本文件必须保持 UTF-8 **带 BOM** 编码：PowerShell 5.1 会把无 BOM 的 .ps1',
'#    按系统 ANSI 解码，中文乱码会导致脚本直接解析失败。',
'# 用法（在项目目录里）：',
'#   powershell -ExecutionPolicy Bypass -File "<工单根目录>\\take.ps1"          取一条待处理并标记为 doing',
'#   powershell -ExecutionPolicy Bypass -File "<工单根目录>\\take.ps1" -List    只列出，不领取',
'#   powershell -ExecutionPolicy Bypass -File "<工单根目录>\\take.ps1" -Project xxx  指定项目',
'# 项目名默认取当前工作目录名。',
'param(',
'  [string]$Project = "",',
'  [switch]$List',
')',
'$ErrorActionPreference = "Stop"',
'if(-not $Project){ $Project = Split-Path -Leaf $PWD }',
'$root = $PSScriptRoot',
'$path = Join-Path (Join-Path $root $Project) "board.json"',
'if(-not (Test-Path -LiteralPath $path)){',
'  # 当前目录名与工单子目录名不一致 → 列出所有项目及其待处理数，别让 agent 猜',
'  $found = @()',
'  Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue | ForEach-Object {',
'    $bf = Join-Path $_.FullName "board.json"',
'    if(Test-Path -LiteralPath $bf){',
'      try{',
'        $jj = [System.IO.File]::ReadAllText($bf, [System.Text.Encoding]::UTF8) | ConvertFrom-Json',
'        $n = @($jj.lists | ForEach-Object { $_.cards } | Where-Object { $_.status -eq "todo" }).Count',
'        $found += ("  " + $_.Name + "   (待处理 " + $n + ")")',
'      }catch{}',
'    }',
'  }',
'  if($found.Count -gt 0){',
'    Write-Output ("当前目录名 """ + $Project + """ 下没有工单文件。工单根目录下的项目：")',
'    $found | ForEach-Object { Write-Output $_ }',
'    Write-Output "用 -Project <名字> 指定"',
'  } else {',
'    Write-Error ("找不到工单文件: " + $path)',
'  }',
'  exit 1',
'}',
'$raw = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)',
'$j = $raw | ConvertFrom-Json',
'$todo = @($j.lists | ForEach-Object { $_.cards } | Where-Object { $_.status -eq "todo" })',
'if($List -or $todo.Count -eq 0){',
'  if($todo.Count -eq 0){ Write-Output "（没有待处理的工单）" }',
'  else { $todo | ForEach-Object { Write-Output ("【" + $_.title + "】" + $_.desc) } }',
'  exit 0',
'}',
'# 领取第一条：标记为 doing，避免下次重复领',
'$c = $todo[0]',
'$c.status = "doing"',
'$j.rev = [int]$j.rev + 1',
'$j.updatedAt = (Get-Date).ToUniversalTime().ToString("o")',
'$out = $j | ConvertTo-Json -Depth 20',
'[System.IO.File]::WriteAllText($path, $out, (New-Object System.Text.UTF8Encoding($false)))',
'Write-Output ("已领取：" + $c.title + "（status -> doing）")',
'Write-Output ("【" + $c.title + "】" + $c.desc)',
''
].join('\n');

/** 在工单根目录写好 take.ps1（agent 的取件入口）
 *  ⚠️ 必须写 UTF-8 **带 BOM**：PowerShell 5.1 会把无 BOM 的 .ps1 按系统 ANSI 解码，
 *     脚本里的中文会变乱码并直接导致解析失败（无 BOM 的 .ps1 在 5.1 下不可用）。
 *     File System Access API 写字符串默认不带 BOM，所以 TAKE_PS1 首行自带 U+FEFF。 */
async function writeTakeScript(){
  if(!dirHandle) return;
  try{
    const fh=await dirHandle.getFileHandle('take.ps1',{create:true});
    const w=await fh.createWritable();
    await w.write(TAKE_PS1);
    await w.close();
  }catch(e){}
}
/** 在项目代码目录写 .board-path 指针（agent 一进项目就能看到工单在哪） */
async function writeBoardPath(codeDir,projName,rootAbs){
  try{
    const fh=await codeDir.getFileHandle('.board-path',{create:true});
    const w=await fh.createWritable();
    w.write([
      '# Aurora Board 工单指针（供 Agent 读取）',
      '# 本项目的工单文件：',
      '#   '+rootAbs+'\\'+projName+'\\board.json',
      '# 取件（自动按当前目录名定位项目，并把领到的卡片标记为 doing）：',
      '#   powershell -ExecutionPolicy Bypass -File "'+rootAbs+'\\take.ps1"',
      'project: '+projName
    ].join('\n'));
    await w.close();
  }catch(e){}
}
/** 新建一个工单项目：选**项目代码目录** → 自动建工单子目录 + 初始 board.json + 项目目录写 .board-path */
async function createProjectDir(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持目录选择，请用「新建工单文件…」'); return; }
  try{
    if(!dirHandle){ toast('请先「选择工单根目录」，再新建项目'); return; }
    const codeDir=await window.showDirectoryPicker({mode:'readwrite'});
    const projName=codeDir.name;
    const pd=await dirHandle.getDirectoryHandle(projName,{create:true});
    const fh=await pd.getFileHandle('board.json',{create:true});
    const seed={
      title:projName,
      lists:[{id:uid('l'),title:'待处理',color:'#7d879c',cards:[]}],
      labels:loadStandaloneLabels(),
      images:{}
    };
    const w=await fh.createWritable();
    await w.write(JSON.stringify(Object.assign({},seed,{app:'aurora-board',version:1,rev:1,updatedAt:new Date().toISOString()}),null,2));
    await w.close();
    await writeBoardPath(codeDir,projName,boardsRoot());
    await scanProjects();
    toast('已创建工单项目「'+projName+'」');
  }catch(e){ if(e&&e.name!=='AbortError') toast('创建失败：'+((e&&e.message)||'未知错误')); }
}
async function restoreFileHandle(){
  try{
    const d=await metaGet(DIR_HANDLE_KEY);
    if(d&&d.queryPermission){
      const p=await d.queryPermission({mode:'readwrite'});
      if(p==='granted'){
        dirHandle=d; fileHandles=[]; fileSyncOn=true;
        await scanProjects(); return;
      }
      pendingDir=d;
    }
    const h=await metaGet(FILE_HANDLE_KEY);
    const hs=Array.isArray(h)?h:(h?[h]:[]);
    if(hs.length&&hs[0].queryPermission){
      const ps=await Promise.all(hs.map(x=>x.queryPermission({mode:'readwrite'})));
      if(ps.every(x=>x==='granted')){
        fileHandles=hs; dirHandle=null; fileSyncOn=true;
        await scanProjects(); return;
      }
      pendingHandle=hs;
    }
  }catch(e){}
  renderFileStatus();
}

  ];
  const cp=curProject();
  if(cp) list.push('-',{label:'重命名当前项目（'+cp.name+'）',icon:()=>svg(['M12 20h9','M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z']),onClick:()=>renameProject()});
  if(cp) list.push({label:'恢复「'+cp.name+'」上一版',icon:()=>svg(['M3 12a9 9 0 1 0 3-6.7L3 8','M3 3v5h5']),onClick:()=>restoreBackup(cp)});
  if(pendingDir||pendingHandle){
    list.push({label:'重新授权连接',icon:()=>svg(['M12 3l2.2 1.6 2.6-.3 1 2.4 2.2 1.4-.7 2.5 1 2.4-1.9 1.8.2 2.6-2.5.6-1.6 2.1-2.3-1.1-2.3 1.1-1.6-2.1-2.5-.6.2-2.6-1.9-1.8 1-2.4-.7-2.5L5 7.1l1-2.4 2.6.3z','M9 12l2 2 4-4']),onClick:async()=>{
      try{
        if(pendingDir){
          const p=await pendingDir.requestPermission({mode:'readwrite'});
          if(p==='granted'){ await connectDirectory(pendingDir); toast('已重新连接'); }
          else toast('未获得授权');
        }else if(pendingHandle&&pendingHandle[0]){
          const p=await pendingHandle[0].requestPermission({mode:'readwrite'});
          if(p==='granted'){ await connectFiles(pendingHandle); toast('已重新连接'); }
          else toast('未获得授权');
        }
      }catch(err){ toast('授权失败'); }
    }});
  }
  if(fileSyncOn) list.push('-',{label:'断开连接',danger:true,icon:()=>svg(['M18 6L6 18','M6 6l12 12']),onClick:()=>{
    fileSyncOn=false; dirHandle=null; fileHandles=[]; pendingHandle=null; pendingDir=null;
    try{ metaSet(FILE_HANDLE_KEY,null); metaSet(DIR_HANDLE_KEY,null); }catch(e){}
    projects=[]; curKey='__all__';
    board=standalone; labels=loadStandaloneLabels();
    renderAll(); renderProjSwitch(); renderFileStatus();
    toast('已断开文件同步');
  }});
  openMenu(b,{list:list});
});
window.addEventListener('focus',()=>{ if(fileSyncOn) readProjects(); });
setInterval(()=>{ if(fileSyncOn) readProjects(); },4000);

/* ============================================================
   顶栏动作
   ============================================================ */
$('#boardTitle').addEventListener('blur',e=>{
  const v=e.target.textContent.trim()||'Aurora Board';
  board.title=v; e.target.textContent=v; save();
});
$('#boardTitle').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();e.target.blur();} });

$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme;
  document.documentElement.dataset.theme=cur==='dark'?'light':'dark';
  savePref();
  toast(cur==='dark'?'已切换亮色主题':'已切换暗色主题');
});
(function initTheme(){
  try{
    const p=JSON.parse(localStorage.getItem(PREF)||'{}');
    if(p.theme) document.documentElement.dataset.theme=p.theme;
  }catch(e){}
})();

$('#exportBtn').addEventListener('click',async()=>{
  if(projects.length&&curKey==='__all__'){ toast('「全部项目」是只读汇总视图，请先切换到具体项目再导出'); return; }
  // 一并导出标签表与图片，导入方即可完整还原（名称、颜色、截图）
  const src=projects.length?curProject().data:board;
  const imgs={};
  for(const id of collectImageIds(src)){
    let d=imgCache.get(id);
    if(!d){ try{ const rec=await idbGet(id); d=rec&&rec.data; }catch(e){} }
    if(d) imgs[id]=d;
  }
  const payload=Object.assign({},src,{app:'aurora-board',version:1,rev:(projects.length?(curProject().rev||0):localRev),updatedAt:new Date().toISOString(),labels:labels,images:imgs});
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='board-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(Object.keys(imgs).length?('已导出 JSON（含 '+Object.keys(imgs).length+' 张图片）'):'已导出 JSON');
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.lists)||!d.lists.length) throw new Error('格式错误');
      if(projects.length){
        // 工单模式：导入替换当前项目的数据
        const p=curProject();
        if(!p){ toast('「全部项目」是只读汇总视图，请先切换到具体项目再导入'); return; }
        await applyFileData(d,p.data);
        p.rev=Number(d.rev)||0;
        save(); refreshCurrentView();
        toast('已导入到「'+p.name+'」');
        return;
      }
      if(Array.isArray(d.labels)&&d.labels.length){
        labels=d.labels.filter(x=>x&&x.id).map(x=>({
          id:String(x.id),
          name:String(x.name||x.id),
          color:/^#[0-9a-fA-F]{6}$/.test(x.color)?x.color:'#7d879c'
        }));
        saveLabels();
      }
      // 图片：写回 IndexedDB，并入内存缓存
      if(d.images&&typeof d.images==='object'){
        const ks=Object.keys(d.images);
        for(const k of ks){
          const data=d.images[k];
          if(typeof data!=='string'||!data) continue;
          const mime=(/^data:([^;]+)/.exec(data)||[])[1]||'image/jpeg';
          try{ await idbPut(k,{mime:mime,data:data}); }catch(e){}
          imgCache.set(k,data);
        }
      }
      delete d.labels; delete d.images;
      board=d;
      if(!board.title) board.title='Aurora Board';
      pruneDanglingLabels();
      board.lists.forEach(l=>l.cards.forEach(c=>{ if(!STATUSES[c.status]) c.status='todo'; }));
      save(); renderBoard(); toast('导入成功');
    }catch(err){ toast('导入失败：'+err.message); }
  };
  r.readAsText(f);
  e.target.value='';
});
$('#resetBtn').addEventListener('click',async()=>{
  const ok=await confirmDlg('恢复示例数据？','当前看板的全部内容将被示例数据覆盖，此操作不可撤销。','覆盖并恢复',true);
  if(!ok) return;
  board=seed(); save(); renderBoard(); toast('已恢复示例数据');
});

/* ============================================================
   键盘
   ============================================================ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    // 按层级从高到低关闭：确认框(1500) > 工具栏面板(1350) > 气泡(1300) > 菜单(1200) > 详情弹窗(1100)
    if(cf.classList.contains('show')) return closeConfirm(false);
    if(remindPanel.classList.contains('show')) return closeRemind();
    if(tagMgr.classList.contains('show')) return closeTagMgr();
    if(popEl.classList.contains('show')) return closePop();
    if(menuEl.classList.contains('show')) return closeMenu();
    if(modalCtx.cardId) return closeModal();
  }
});

/* 兜底：释放全局指针 */
window.addEventListener('blur',()=>{ if(drag) onUp(); });
document.addEventListener('dragstart',e=>{ if(e.target.closest&&e.target.closest('.card')) e.preventDefault(); });

/* 启动：先加载图片缓存，再渲染（否则图片渲染时取不到 dataURL） */
loadImages().then(function(){
  renderBoard();
  renderRemind();
  renderFileStatus();
  restoreFileHandle();
});

/* 跨天守护：页面开着过夜时"今天"会变成"昨天"，
   需重算全部卡片的到期状态与提醒中心（每分钟检查日期是否翻篇） */
let lastDay=todayStr();
setInterval(()=>{
  const t=todayStr();
  if(t===lastDay) return;
  lastDay=t;
  allCards().forEach(c=>{
    const node=boardEl.querySelector('.card[data-id="'+c.id+'"]');
    if(node) applyDueState(node,c);
  });
  renderRemind();
},60000);
</script>
