<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Board · 高颜值看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff6a3d'/%3E%3Crect x='5' y='5' width='5.5' height='14' rx='1.5' fill='%23fff'/%3E%3Crect x='13.5' y='5' width='5.5' height='8' rx='1.5' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<style>
/* ============================================================
   0. 设计令牌
   ============================================================ */
:root{
  --orange:#ff6a3d;
  --red:#ff3d5a;
  --amber:#ffb020;
  --green:#3ecf8e;
  --blue:#4d9dff;
  --purple:#a77bff;
  --teal:#2fd6c4;
  --pink:#ff6fae;
  --radius-l:18px;
  --radius-m:14px;
  --radius-s:10px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --list-w:308px;
}
html[data-theme="dark"]{
  --bg:#080a10;
  --bg2:#0d1018;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.09);
  --stroke-2:rgba(255,255,255,.16);
  --text:#eef1f7;
  --text-2:#a8b0c2;
  --text-3:#6f7891;
  --card:rgba(255,255,255,.05);
  --card-hover:rgba(255,255,255,.085);
  --shadow:0 18px 40px -12px rgba(0,0,0,.65);
  --shadow-s:0 6px 16px -6px rgba(0,0,0,.55);
  --modal:rgba(22,25,34,.94);
  --scrim:rgba(4,6,10,.72);
}
html[data-theme="light"]{
  --bg:#f4f5f9;
  --bg2:#eceef5;
  --panel:rgba(255,255,255,.75);
  --panel-2:#ffffff;
  --stroke:rgba(19,24,38,.10);
  --stroke-2:rgba(19,24,38,.2);
  --text:#151a26;
  --text-2:#5a6478;
  --text-3:#8b93a6;
  --card:#ffffff;
  --card-hover:#ffffff;
  --shadow:0 18px 40px -14px rgba(24,30,50,.28);
  --shadow-s:0 6px 16px -6px rgba(24,30,50,.18);
  --modal:rgba(255,255,255,.96);
  --scrim:rgba(30,36,52,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Segoe UI",-apple-system,system-ui,sans-serif;
  font-size:14px;line-height:1.55;overflow:hidden;
  transition:background .35s var(--ease),color .35s var(--ease);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:padding-box}
button,input,textarea{font:inherit;color:inherit}
/* 视觉隐藏但仍在 DOM 中（文件选择框；用 display:none 会让它无法被自动化工具定位） */
.vh{position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none}
button{cursor:pointer;border:none;background:none}
input,textarea{outline:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* 背景光晕 */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-14vw;background:radial-gradient(circle,rgba(255,106,61,.5),transparent 65%)}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:-8vw;background:radial-gradient(circle,rgba(255,61,90,.38),transparent 65%);animation-delay:-7s}
.aurora i:nth-child(3){width:52vw;height:52vw;left:28vw;bottom:-30vw;background:radial-gradient(circle,rgba(77,157,255,.28),transparent 65%);animation-delay:-13s}
html[data-theme="light"] .aurora i{opacity:.28;filter:blur(80px)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,3vh) scale(1.08)}66%{transform:translate(-3vw,-2vh) scale(.95)}}

/* ============================================================
   1. 顶栏
   ============================================================ */
.shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{
  flex:none;padding:14px 20px 10px;
  background:linear-gradient(180deg,rgba(10,12,20,.9),rgba(10,12,20,.45) 70%,transparent);
  backdrop-filter:blur(14px);
}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.4) 70%,transparent)}
.topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--orange),var(--red) 55%,#ff9a3d);
  display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(255,80,50,.7);
}
.logo svg{width:20px;height:20px}
.brand h1{
  margin:0;font-size:18px;font-weight:800;letter-spacing:.4px;white-space:nowrap;
  background:linear-gradient(100deg,#fff 10%,#ffb48a 55%,#ff6a3d 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
html[data-theme="light"] .brand h1{background:linear-gradient(100deg,#1b2130 10%,#ff7a4d 60%,#ff3d5a 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:11px;color:var(--text-3);letter-spacing:2.5px;text-transform:uppercase;margin-top:-2px}
.spacer{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  display:flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--stroke);font-size:12px;color:var(--text-2);
}
.stat b{font-size:14px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);
  border:1px solid transparent;transition:.2s var(--ease);flex:none;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--stroke)}
.icon-btn.on{color:var(--orange);border-color:var(--stroke-2);background:var(--panel-2)}
.icon-btn svg{width:17px;height:17px}
.sync-tip{font-size:10.5px;color:var(--text-3);white-space:nowrap;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
/* 截止日期提醒：铃铛 */
.icon-btn.bell{position:relative}
.bell-count{
  position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:linear-gradient(135deg,var(--red),#ff8a3d);
  color:#fff;font-size:9.5px;font-weight:800;line-height:16px;text-align:center;
  font-variant-numeric:tabular-nums;border:1.5px solid var(--bg);
}
.bell-count[hidden]{display:none}
.icon-btn.bell.alert{color:var(--red)}
.icon-btn.bell.alert svg{animation:bellShake 3s ease-in-out infinite}
@keyframes bellShake{
  0%,86%,100%{transform:rotate(0)}
  89%{transform:rotate(12deg)}
  92%{transform:rotate(-10deg)}
  95%{transform:rotate(6deg)}
  97%{transform:rotate(-4deg)}
}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--panel);border:1px solid var(--stroke);color:var(--text-2);transition:.2s var(--ease);
}
.btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--stroke-2);transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn-primary{
  background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px -8px rgba(255,80,50,.8);
}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-danger{color:var(--red);border-color:rgba(255,61,90,.35)}
.btn-danger:hover{background:rgba(255,61,90,.14);color:var(--red)}
/* 构建戳：部署时由 GitHub Actions 注入 commit+时间，便于确认线上是否新版 */
.build-stamp{
  font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--text-3);
  font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:999px;
  background:var(--panel);border:1px solid var(--stroke);white-space:nowrap;flex:none;
}
@media(max-width:900px){.build-stamp{display:none}}

/* 工具条 */
.toolbar{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.search{position:relative;flex:0 1 260px;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3)}
.search input{
  width:100%;padding:8px 32px 8px 33px;border-radius:10px;background:var(--panel);
  border:1px solid var(--stroke);transition:.2s var(--ease);font-size:13px;
}
.search input:focus{border-color:var(--orange);background:var(--panel-2);box-shadow:0 0 0 3px rgba(255,106,61,.15)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:7px;display:none;place-items:center;color:var(--text-3)}
.search .clr:hover{background:var(--panel-2);color:var(--text)}
.search.has .clr{display:grid}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fc{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;
  border:1px solid var(--stroke);background:var(--panel);color:var(--text-2);transition:.2s var(--ease);
}
.fc:hover{transform:translateY(-1px);border-color:var(--stroke-2)}
.fc.on{color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.fc .dot{width:8px;height:8px;border-radius:50%;flex:none}
.fc.on .dot{background:rgba(255,255,255,.85)!important}
.filter-label{font-size:11px;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase;margin-right:2px}
/* 项目切换器（多项目工单流） */
.proj-switch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pc{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid var(--stroke);background:var(--panel);
  color:var(--text-2);transition:.16s var(--ease);white-space:nowrap;
}
.pc:hover{border-color:var(--stroke-2);color:var(--text)}
.pc.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--orange),var(--red));box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}

/* ============================================================
   2. 看板区
   ============================================================ */
.board-wrap{flex:1;min-height:0;overflow:auto;padding:6px 20px 26px;scroll-behavior:auto;overscroll-behavior:contain}
.board-inner{display:flex;align-items:flex-start;gap:16px;height:100%;width:max-content;padding-right:8px}

/* --- 列表 --- */
.list{
  width:var(--list-w);flex:none;display:flex;flex-direction:column;
  max-height:calc(100% - 4px);align-self:flex-start;
  background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius-l);
  box-shadow:var(--shadow-s);backdrop-filter:blur(10px);
  transition:box-shadow .25s var(--ease),border-color .25s var(--ease),opacity .2s,transform .2s;
  animation:listIn .38s var(--ease) both;
}
@keyframes listIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.list:hover{border-color:var(--stroke-2)}
.list.drop-target{
  border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,106,61,.3),0 20px 44px -14px rgba(255,106,61,.35);
  background:var(--panel-2);
}
.list.is-source{opacity:.32;filter:grayscale(.5);border-style:dashed;box-shadow:none}
.list-header{
  display:flex;align-items:center;gap:8px;padding:12px 10px 10px 14px;cursor:grab;
  touch-action:none;user-select:none;flex:none;border-bottom:1px solid var(--stroke);
}
.list-header:active{cursor:grabbing}
.list-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.list-title{
  font-size:14px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px;border-radius:6px;margin-left:-4px;
}
.list-title:hover{background:var(--panel-2)}
.list-title[contenteditable="true"]{background:var(--panel-2);outline:1px solid var(--orange);cursor:text}
.list-title[contenteditable="true"]:empty::before{content:"未命名列表";color:var(--text-3)}
.list-count{
  font-size:11px;font-weight:700;color:var(--text-3);background:var(--panel-2);
  padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums;flex:none;
}
.list-bar{height:3px;margin:0 14px;border-radius:3px;background:var(--panel-2);overflow:hidden;flex:none}
.list-bar i{display:block;height:100%;border-radius:3px;transition:width .45s var(--ease)}
.list-body{
  flex:1;min-height:24px;overflow-y:auto;overflow-x:hidden;padding:10px;
  display:flex;flex-direction:column;gap:9px;
}
/* 卡片在纵向 flex 容器里默认 flex-shrink:1，会被压扁而不是让容器溢出；
   而 .card 带 overflow:hidden → 自动最小尺寸变成 0，卡片可被压到极扁，
   于是 overflow-y:auto 永不触发（列里超过 6 张就挤成一团、没有滚动条）。
   锁死不伸缩：卡片保持自然高度，超出部分交给 .list-body 滚动。 */
.list-body > .card{flex:none}
.list-body:empty::after{
  content:"把卡片拖到这里";display:grid;place-items:center;min-height:66px;
  font-size:12px;color:var(--text-3);border:1.5px dashed var(--stroke-2);border-radius:var(--radius-m);
}
body.dragging .list-body:empty::after{
  content:"放这里";border-color:var(--orange);color:var(--orange);
  background:rgba(255,106,61,.07);min-height:84px;transition:min-height .2s var(--ease);
}
body.dragging .list.is-source .list-body:empty::after{content:"整列拖拽中";color:var(--text-3);border-color:var(--stroke-2);background:none}
.list-foot{flex:none;padding:0 10px 10px}
.add-card{
  width:100%;padding:8px 10px;border-radius:var(--radius-s);color:var(--text-3);
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;transition:.18s var(--ease);
}
.add-card:hover{background:var(--panel-2);color:var(--text)}
.add-card svg{width:15px;height:15px}

/* --- 卡片 --- */
.card{
  position:relative;padding:11px 12px 10px;border-radius:var(--radius-m);cursor:grab;
  background:var(--card);border:1px solid var(--stroke);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,border-color .2s,opacity .2s;
  touch-action:none;user-select:none;overflow:hidden;
  animation:cardIn .34s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:0;transition:.2s var(--ease);
  background:linear-gradient(180deg,var(--orange),var(--red));
}
.card:hover{background:var(--card-hover);border-color:var(--stroke-2);transform:translateY(-2px);box-shadow:var(--shadow-s)}
.card:hover::before{opacity:.85}
.card:active{cursor:grabbing}
.card.is-source{
  opacity:.28;filter:grayscale(.6);border-style:dashed;transform:none!important;
  box-shadow:none;background:transparent;
}
.card.is-source::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px);
}
.card.hidden{display:none}
.card-labels{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.card-labels:empty{display:none}
/* 卡片状态：列表恒定按项目，进度用状态标记表达（agent 工单流） */
.st-chip{
  font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:6px;letter-spacing:.3px;
  border:1px solid currentColor;background:transparent;flex:none;
}
.st-picker{display:flex;gap:6px;flex-wrap:wrap}
.st-btn{
  padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;
  border:1px solid var(--stroke);background:var(--panel);color:var(--text-3);transition:.16s var(--ease);
}
.st-btn:hover{border-color:var(--stroke-2);color:var(--text-2)}
.st-btn.on{color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.st-btn.on[data-st="todo"]{background:#7d879c}
.st-btn.on[data-st="doing"]{background:#4d9dff}
.st-btn.on[data-st="review"]{background:#ff8a3d}
.st-btn.on[data-st="done"]{background:#3ecf8e}
.lbl{
  font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:6px;letter-spacing:.3px;
  color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.22);
}
/* 浅色底标签改用深色字，保证可读 */
.lbl.dark,.m-lbl.dark{color:#4a3a00;text-shadow:none}
.card-title{font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.card-title[contenteditable="true"]{
  outline:1px solid var(--orange);border-radius:6px;padding:2px 4px;margin:-2px -4px;background:rgba(255,255,255,.05);cursor:text;
}
.card-desc{
  font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.5;
  word-break:break-word;max-height:186px;overflow:hidden;
}
/* 富文本渲染（卡片预览与弹窗共用）：
   注意 —— 这里的 HTML 全部由 mdToHtml() 生成（用户文本先转义再结构化替换），
   不存在把用户原文直接塞进 innerHTML 的路径 */
.rd img{max-width:100%;border-radius:8px;border:1px solid var(--stroke);display:block}
.rd p{margin:0 0 4px}
.rd p:last-child{margin-bottom:0}
.rd ul,.rd ol{margin:3px 0;padding-left:18px}
.rd li{margin:1px 0}
.rd h3,.rd h4,.rd h5,.rd h6{margin:6px 0 2px;font-size:12.5px;color:var(--text-2);font-weight:700}
.rd code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;background:var(--panel-2);padding:1px 5px;border-radius:4px}
.rd blockquote{margin:5px 0;padding-left:9px;border-left:2px solid var(--stroke-2);color:var(--text-2)}
.rd a{color:var(--orange);text-decoration:none;word-break:break-all}
.rd a:hover{text-decoration:underline}
.rd hr{border:none;border-top:1px solid var(--stroke);margin:7px 0}
.rd del{opacity:.7}
.rd .rd-bad{color:var(--red);font-size:11px}
.rd .rd-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rd .rd-imgs img{width:auto;max-height:96px;object-fit:cover}
/* 弹窗内的描述：编辑区 + 预览区 */
.m-desc-bar{display:flex;align-items:center;gap:8px;margin-top:14px;margin-bottom:5px}
.m-desc-bar .hint{flex:1;font-size:11px;color:var(--text-3)}
.m-desc-view{margin-top:8px;font-size:13px;color:var(--text-2);line-height:1.65}
.m-desc-view:empty{display:none}
.m-desc-view img{max-height:300px;object-fit:contain;margin:5px 0}
.card-meta{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.meta{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.meta svg{width:13px;height:13px;flex:none}
.meta.done{color:var(--green)}
.meta.warn{color:var(--amber)}
.meta.danger{color:var(--red)}
.card-prog{height:3px;border-radius:3px;background:var(--panel-2);margin-top:9px;overflow:hidden}
.card-prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .45s var(--ease)}
.card-badge{
  position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;
  background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;letter-spacing:.3px;
}
/* 截止日期：卡片级视觉强化 */
.card.due-over{border-color:rgba(255,61,90,.42)}
.card.due-over::before{opacity:1;background:linear-gradient(180deg,#ff3d5a,#ff6a3d)}
.card.due-today::before{opacity:1;background:linear-gradient(180deg,#ff8a3d,#ffb020)}
.card.due-soon::before{opacity:1;background:linear-gradient(180deg,#ffb020,#f5c451)}
/* 脉冲与闪烁统一走 .card-fx 覆盖层：
   不改写卡片自身的 animation / box-shadow，动画未运行时只是不显示，不会留下残影 */
.card-fx{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;border:1.5px solid transparent;z-index:1;
}
.card.due-over .card-fx{animation:duePulse 2.2s ease-in-out infinite;border-color:rgba(255,61,90,.8)}
@keyframes duePulse{0%,100%{opacity:0}50%{opacity:.95}}
.due-chip{
  font-size:11px;font-weight:700;padding:1.5px 7px;border-radius:6px;
  background:var(--panel-2);color:var(--text-3);border:1px solid transparent;line-height:1.5;
}
.due-chip.due-over{background:rgba(255,61,90,.16);color:#ff5c5c;border-color:rgba(255,61,90,.34)}
.due-chip.due-today{background:rgba(255,138,61,.16);color:#ff8a3d;border-color:rgba(255,138,61,.34)}
.due-chip.due-soon{background:rgba(255,176,32,.15);color:#e0a020;border-color:rgba(255,176,32,.30)}
html[data-theme="light"] .due-chip.due-soon{color:#b3780a}
html[data-theme="light"] .due-chip.due-over{color:#c6283c}
html[data-theme="light"] .due-chip.due-today{color:#b45309}
/* 提醒中心跳转定位的闪烁 */
.card.flash .card-fx{animation:cardFlash 1.15s ease-out;border-color:rgba(255,106,61,.9)}
@keyframes cardFlash{0%{opacity:1}100%{opacity:0}}

/* 拖拽幽灵 */
.drag-layer{position:fixed;inset:0;pointer-events:none;z-index:900}
.ghost{position:fixed;left:0;top:0;pointer-events:none;box-shadow:0 26px 50px -12px rgba(0,0,0,.65);will-change:transform}
.card.ghost{
  opacity:.97;transform-origin:14px 14px;cursor:grabbing;border-color:rgba(255,255,255,.2);
  animation:none;
}
.card.ghost::before{opacity:1}
/* 拖拽进行中：全局禁用 hover 位移，避免幽灵与占位符抖动 */
body.dragging .card:not(.ghost):hover{transform:none}
.list.ghost{
  width:var(--list-w);opacity:.96;transform-origin:18px 18px;cursor:grabbing;
  animation:none;border-color:var(--orange);box-shadow:0 30px 60px -14px rgba(0,0,0,.7);
}

/* 添加列表 */
.add-list{
  width:270px;flex:none;align-self:flex-start;padding:14px;border-radius:var(--radius-l);
  border:1.5px dashed var(--stroke-2);color:var(--text-3);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:8px;transition:.22s var(--ease);background:transparent;
}
.add-list:hover{color:var(--orange);border-color:var(--orange);background:rgba(255,106,61,.07);transform:translateY(-2px)}
.add-list svg{width:16px;height:16px}

/* ============================================================
   3. 菜单 / 气泡
   ============================================================ */
.menu{
  position:fixed;z-index:1200;min-width:186px;padding:6px;border-radius:13px;
  background:var(--modal);border:1px solid var(--stroke-2);box-shadow:var(--shadow);
  backdrop-filter:blur(20px);display:none;animation:menuIn .16s var(--ease) both;
}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.menu.show{display:block}
.menu button{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  font-size:13px;color:var(--text-2);text-align:left;transition:.14s;
}
.menu button:hover{background:var(--panel-2);color:var(--text)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:rgba(255,61,90,.14)}
.menu button svg{width:15px;height:15px;flex:none;opacity:.85}
.menu hr{border:none;border-top:1px solid var(--stroke);margin:5px 8px}
.menu .swatches{display:flex;gap:6px;padding:7px 10px;flex-wrap:wrap}
.menu .sw{width:22px;height:22px;border-radius:7px;transition:.18s var(--ease);border:2px solid transparent}
.menu .sw:hover{transform:scale(1.15)}
.menu .sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--modal),0 0 0 3.5px currentColor}

/* 标签选择器 */
.pop{
  position:fixed;z-index:1300;padding:12px;border-radius:14px;background:var(--modal);
  border:1px solid var(--stroke-2);box-shadow:var(--shadow);backdrop-filter:blur(20px);
  display:none;animation:menuIn .16s var(--ease) both;
}
.pop.show{display:block}
.pop h4{margin:0 0 9px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.pop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pop .opt{
  padding:8px 6px;border-radius:9px;font-size:11.5px;font-weight:700;color:#fff;text-align:center;
  transition:.18s var(--ease);border:2px solid transparent;
}
.pop .opt.dark{color:#4a3a00}
.pop .opt:hover{transform:translateY(-2px) scale(1.04)}
.pop .opt.on{border-color:#fff;box-shadow:0 0 0 2px var(--modal),0 0 0 3.5px currentColor}

/* 截止日期提醒中心 */
.remind{
  position:fixed;z-index:1350;width:min(340px,calc(100vw - 24px));
  padding:6px;border-radius:15px;background:var(--modal);
  border:1px solid var(--stroke-2);box-shadow:var(--shadow);backdrop-filter:blur(20px);
  display:none;animation:menuIn .16s var(--ease) both;
}
.remind.show{display:block}
.remind-head{display:flex;align-items:baseline;gap:8px;padding:8px 10px 7px}
.remind-head h4{margin:0;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.remind-head .rs{margin-left:auto;font-size:11px;color:var(--text-3)}
.rgroup{padding:2px 0 4px}
.rgroup+.rgroup{border-top:1px solid var(--stroke)}
.rg-h{display:flex;align-items:center;gap:6px;padding:8px 10px 5px;font-size:11.5px;font-weight:700;color:var(--text-2)}
.rg-h .dot{width:7px;height:7px;border-radius:50%;flex:none}
.rg-h b{font-variant-numeric:tabular-nums}
.ritem{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:10px;transition:background .14s}
.ritem:hover{background:var(--panel-2)}
.ri-t{
  display:block;font-size:13px;font-weight:600;color:var(--text);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ri-s{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--text-3);min-width:0}
.ri-s .ldot{width:6px;height:6px;border-radius:50%;flex:none}
.ri-s .lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.remind-empty{padding:22px 12px;text-align:center;font-size:12.5px;color:var(--text-3)}

/* 标签管理面板 */
.tagmgr{
  position:fixed;z-index:1350;width:min(340px,calc(100vw - 24px));
  padding:6px;border-radius:15px;background:var(--modal);
  border:1px solid var(--stroke-2);box-shadow:var(--shadow);backdrop-filter:blur(20px);
  display:none;animation:menuIn .16s var(--ease) both;
}
.tagmgr.show{display:block}
.tagmgr .tm-hd{display:flex;align-items:baseline;gap:8px;padding:8px 10px 6px}
.tagmgr .tm-hd h4{margin:0;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.tagmgr .tm-hd .rs{margin-left:auto;font-size:11px;color:var(--text-3)}
.tmrow{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:10px}
.tmrow:hover{background:var(--panel-2)}
.tm-swatch{width:22px;height:22px;border-radius:7px;flex:none;border:2px solid transparent;transition:.16s var(--ease)}
.tm-swatch:hover{transform:scale(1.14)}
.tm-name{
  flex:1;min-width:0;padding:6px 9px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--stroke);font-size:13px;color:var(--text);
}
.tm-name:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,61,.14)}
.tm-del{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;color:var(--text-3);transition:.16s}
.tm-del:hover{background:rgba(255,61,90,.16);color:var(--red)}
.tm-del svg{width:14px;height:14px}
.tm-add{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;color:var(--orange);border:1px solid var(--stroke-2);transition:.16s}
.tm-add:hover{background:var(--panel-2);border-color:var(--orange)}
.tm-add svg{width:14px;height:14px}
.tm-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:4px 8px 10px}
.tm-sw{width:100%;height:22px;border-radius:6px;border:2px solid transparent;transition:.16s}
.tm-sw:hover{transform:scale(1.14)}
.tm-sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--modal),0 0 0 3.5px currentColor}
.tm-custom{width:100%;height:22px;padding:0;border:2px solid var(--stroke-2);border-radius:6px;background:transparent;cursor:pointer}
.tm-custom::-webkit-color-swatch-wrapper{padding:0}
.tm-custom::-webkit-color-swatch{border:none;border-radius:4px}
.tm-sep{height:1px;background:var(--stroke);margin:6px 6px}
.tm-hint{padding:2px 10px 8px;font-size:11px;color:var(--text-3);line-height:1.5}
/* 标签选择器里的"新建"入口与内联创建表单 */
.pop .opt-add{background:var(--panel-2);color:var(--text-2);border:1.5px dashed var(--stroke-2)}
.pop .opt-add:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,106,61,.08)}
.pop-form{margin-top:9px;padding-top:9px;border-top:1px solid var(--stroke)}
.pop-form .pname{width:100%;padding:7px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--stroke);font-size:13px}
.pop-form .pname:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,61,.14)}
.pop .grid.pcolors{grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.pop .grid.pcolors .opt{padding:0;height:22px;border-radius:6px}
.pop-form .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.mini.primary{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;border-color:transparent}
.mini.primary:hover{filter:brightness(1.08)}

/* Toast */
.toast-wrap{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:1600;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:9px 17px;border-radius:11px;background:var(--modal);border:1px solid var(--stroke-2);
  box-shadow:var(--shadow);font-size:13px;font-weight:600;backdrop-filter:blur(18px);
  animation:toastIn .3s var(--ease) both;
}
.toast.out{animation:toastOut .3s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* ============================================================
   4. 卡片详情弹窗（原位缩放）
   ============================================================ */
.scrim{
  position:fixed;inset:0;z-index:1000;background:var(--scrim);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.scrim.show{opacity:1;pointer-events:auto}
.modal{
  position:fixed;z-index:1100;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(880px,calc(100vw - 40px));max-height:calc(100vh - 64px);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--modal);border:1px solid var(--stroke-2);border-radius:22px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.75);backdrop-filter:blur(26px);
  opacity:0;pointer-events:none;transform-origin:0 0;will-change:transform,opacity;
}
.modal.show{pointer-events:auto}
.modal::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--red),var(--amber));opacity:.9;
}
.m-head{
  flex:none;display:flex;align-items:center;gap:9px;padding:15px 18px 11px;
  border-bottom:1px solid var(--stroke);
}
.crumb{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text-2);
  background:var(--panel-2);padding:4px 10px;border-radius:999px;max-width:230px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.crumb .dot{width:8px;height:8px;border-radius:50%;flex:none}
.m-body{flex:1;overflow-y:auto;padding:18px;display:grid;grid-template-columns:1fr 268px;gap:22px;align-items:start}
@media(max-width:720px){.m-body{grid-template-columns:1fr}}
.m-title{
  width:100%;font-size:21px;font-weight:800;line-height:1.35;border:none;background:transparent;
  resize:none;overflow:hidden;padding:4px 6px;margin-left:-6px;border-radius:9px;word-break:break-word;
}
.m-title:focus{background:var(--panel-2);box-shadow:0 0 0 2px rgba(255,106,61,.28)}
.m-desc{
  width:100%;min-height:72px;font-size:13.5px;line-height:1.65;border:none;background:transparent;resize:none;
  padding:8px 6px;margin-left:-6px;border-radius:9px;color:var(--text-2);margin-top:12px;
}
.m-desc:focus{background:var(--panel-2);box-shadow:0 0 0 2px rgba(255,106,61,.28)}
.sec{margin-top:20px}
.sec-h{
  display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--text-3);margin-bottom:10px;
}
.sec-h .n{color:var(--orange);font-variant-numeric:tabular-nums}
.sec-h .grow{flex:1}
.side{display:flex;flex-direction:column;gap:16px}
.field{
  padding:12px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--stroke);
}
.field .k{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:8px}
.m-labels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.m-labels:empty::after{content:"暂无标签";font-size:12px;color:var(--text-3)}
.m-lbl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;padding:4px 6px 4px 10px;border-radius:8px}
.m-lbl button{width:15px;height:15px;border-radius:5px;display:grid;place-items:center;background:rgba(0,0,0,.22);color:#fff;font-size:11px;line-height:1}
.m-lbl button:hover{background:rgba(0,0,0,.45)}
.mini{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:9px;font-size:12px;font-weight:600;
  border:1px solid var(--stroke);background:var(--panel);color:var(--text-2);transition:.18s var(--ease);
}
.mini:hover{background:var(--panel-2);color:var(--text);border-color:var(--stroke-2)}
.mini svg{width:13px;height:13px}
.date-in{
  width:100%;padding:7px 9px;border-radius:9px;background:var(--panel-2);border:1px solid var(--stroke);
  font-size:12.5px;color:var(--text);font-family:inherit;
}
.date-in.over{color:var(--red);border-color:rgba(255,61,90,.5)}
.pbar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-bottom:7px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .5s var(--ease);border-radius:6px}
.ptext{font-size:11.5px;color:var(--text-3);font-weight:600}
.st-list{display:flex;flex-direction:column;gap:5px}
.st{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  background:var(--panel);border:1px solid transparent;transition:.18s var(--ease);animation:stIn .26s var(--ease) both;
}
@keyframes stIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.st:hover{background:var(--panel-2);border-color:var(--stroke)}
.st.done .st-t{text-decoration:line-through;color:var(--text-3)}
.box{
  width:18px;height:18px;border-radius:6px;border:1.8px solid var(--stroke-2);flex:none;
  display:grid;place-items:center;transition:.2s var(--ease);color:transparent;
}
.box:hover{border-color:var(--green)}
.st.done .box{background:linear-gradient(135deg,var(--green),var(--teal));border-color:transparent;color:#fff}
.box svg{width:12px;height:12px}
.st-t{flex:1;font-size:13px;min-width:0;word-break:break-word;border-radius:6px;padding:1px 3px}
.st-t[contenteditable="true"]{background:var(--panel-2);box-shadow:0 0 0 1px var(--orange);cursor:text}
.st-x{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:.18s;flex:none}
.st:hover .st-x{opacity:1}
.st-x:hover{background:rgba(255,61,90,.16);color:var(--red)}
.st-x svg{width:13px;height:13px}
.st-add{display:flex;gap:8px;margin-top:8px}
.st-add input{
  flex:1;padding:8px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--stroke);font-size:13px;
}
.st-add input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,61,.14)}
.cmt{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--stroke)}
.cmt:last-child{border-bottom:none}
.avatar{
  width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--red));
}
.cmt-b{flex:1;min-width:0}
.cmt-h{display:flex;align-items:baseline;gap:8px}
.cmt-h b{font-size:12.5px}
.cmt-h time{font-size:10.5px;color:var(--text-3)}
.cmt-p{font-size:13px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;margin-top:1px}
.empty-tip{font-size:12.5px;color:var(--text-3);text-align:center;padding:16px 8px;border:1.5px dashed var(--stroke);border-radius:12px}

/* 确认框 */
.confirm{
  position:fixed;z-index:1500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100vw - 40px));
  padding:22px;border-radius:20px;background:var(--modal);border:1px solid var(--stroke-2);
  box-shadow:0 30px 70px -18px rgba(0,0,0,.7);backdrop-filter:blur(24px);display:none;
}
.confirm.show{display:block;animation:menuIn .2s var(--ease) both}
.confirm h3{margin:0 0 7px;font-size:16px;font-weight:800}
.confirm p{margin:0 0 18px;font-size:13px;color:var(--text-2);line-height:1.6}
.confirm .row{display:flex;gap:9px;justify-content:flex-end}

@media(max-width:560px){
  .stats{display:none}
  .topbar{padding:12px 14px 8px}
  .board-wrap{padding:6px 14px 22px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.08s!important}
}
</style>

    <div class="topbar-row">

          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/>
          </svg>
        </div>
        <div>
          <h1 contenteditable="true" spellcheck="false" id="boardTitle">Aurora Board</h1>
          <div class="sub">Kanban Workspace</div>

      <div class="spacer"></div>
      <div class="stats" id="stats"></div>
      <button class="icon-btn bell" id="remindBtn" title="截止日期提醒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span class="bell-count" id="remindCount" hidden>0</span>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="exportBtn" title="导出 JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>

<script>
"use strict";
/* ============================================================
   工具函数
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(txt!=null) e.textContent=txt;
  return e;
}
function svg(paths,extra){
  extra=extra||{};
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox',extra.vb||'0 0 24 24');
  s.setAttribute('fill',extra.fill||'none');
  s.setAttribute('stroke',extra.stroke||'currentColor');
  s.setAttribute('stroke-width',extra.sw||'2');
  s.setAttribute('stroke-linecap','round');
  s.setAttribute('stroke-linejoin','round');
  if(extra.style) s.setAttribute('style',extra.style);
  paths.forEach(d=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); s.appendChild(p);
  });
  return s;
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  const p=iso.split('-');
  if(p.length<3) return iso;
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/86400000);
  if(diff===0) return '今天';
  if(diff===1) return '明天';
  if(diff===-1) return '昨天';
  if(diff>1&&diff<=6) return diff+' 天后';
  if(diff<-1&&diff>=-6) return '逾期 '+(-diff)+' 天';
  return (+p[1])+'月'+(+p[2])+'日';
}
/* 截止日期状态：over=已逾期 / today=今天到期 / soon=临期 / ''=无期限 */
const DUE_SOON_DAYS=3;
function dueDays(card){
  if(!card||!card.due) return null;
  const p=String(card.due).split('-');
  if(p.length<3) return null;
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d.getTime())) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function dueState(card){
  const n=dueDays(card);
  if(n===null) return '';
  if(n<0) return 'over';
  if(n===0) return 'today';
  if(n<=DUE_SOON_DAYS) return 'soon';
  return '';
}
function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=ta.scrollHeight+'px';
}
function debounce(fn,ms){
  let t; return function(){ clearTimeout(t); const a=arguments; t=setTimeout(()=>fn.apply(null,a),ms); };
}

/* ============================================================
   常量
   ============================================================ */
/* 标签表：标签不再写死，每个标签有独立的 id / 名称 / 颜色，可增删改。
   下面 9 个是内置标签，id 与旧版写死色板一一对应，老数据无需迁移。
   卡片的 labels 数组存的是标签 id。 */
const BUILTIN_LABELS=[
  {id:'green', name:'设计',   color:'#3ecf8e'},
  {id:'yellow',name:'待评审', color:'#f5c451'},
  {id:'orange',name:'紧急',   color:'#ff8a3d'},
  {id:'red',   name:'阻塞',   color:'#ff5c5c'},
  {id:'blue',  name:'研发',   color:'#4d9dff'},
  {id:'purple',name:'调研',   color:'#a77bff'},
  {id:'teal',  name:'已完成', color:'#2fd6c4'},
  {id:'pink',  name:'营销',   color:'#ff6fae'},
  {id:'slate', name:'杂项',   color:'#7d879c'}
];
/* 新建 / 改色时的候选色板 */
const TAG_PALETTE=[
  '#ff5c5c','#ff8a3d','#ffb020','#f5c451','#3ecf8e','#2fd6c4','#4d9dff','#a77bff',
  '#ff6fae','#ec4899','#8b5cf6','#6366f1','#0ea5e9','#14b8a6','#22c55e','#eab308',
  '#64748b','#7d879c','#e11d48','#0891b2'
];
const LIST_COLORS = ['#ff6a3d','#ffb020','#3ecf8e','#4d9dff','#a77bff','#2fd6c4','#ff6fae','#7d879c'];
const STORE='aurora.board.v1';
const PREF='aurora.pref.v1';
const LABELS_STORE='aurora.labels.v1';
/* 卡片状态：列表恒定按项目命名，进度用状态标记表达（agent 工单流）。
   流转：待处理 → 处理中 → 待复查（人来复查）→ 已确认 */
const STATUSES={
  todo  :{name:'待处理',color:'#7d879c'},
  doing :{name:'处理中',color:'#4d9dff'},
  review:{name:'待复查',color:'#ff8a3d'},
  done  :{name:'已确认',color:'#3ecf8e'}
};
const STATUS_KEYS=['todo','doing','review','done'];
function statusOf(card){ return (card&&STATUSES[card.status])?card.status:'todo'; }

/* ============================================================
   数据
   ============================================================ */
function mkCard(o){
  return Object.assign({
    id:uid('c'), title:'未命名卡片', desc:'', labels:[], due:'',
    status:'todo', subtasks:[], comments:[], created:new Date().toISOString()
  },o||{});
}
function mkList(title,color,cards){
  return {id:uid('l'),title:title,color:color||LIST_COLORS[0],cards:cards||[]};
}
function seed(){
  const s={
    title:'Aurora Board',
    lists:[
      mkList('需求池','#ff6a3d',[
        mkCard({title:'支持看板列的拖拽排序',labels:['blue','orange'],
          desc:'按住列表标题栏即可整体拖动，列序变化需持久化。',
          subtasks:[{id:uid('s'),title:'设计拖拽阈值',done:true},{id:uid('s'),title:'处理列宽保持',done:true},{id:uid('s'),title:'拖拽中禁用文本选中',done:false}],
          comments:[{id:uid('m'),author:'PM',text:'阈值建议 5px，避免误触。',at:new Date().toISOString()}]}),
        mkCard({title:'卡片支持多颜色标签',labels:['purple'],due:''}),
        mkCard({title:'子任务进度条可视化',labels:['green']})
      ]),
      mkList('进行中','#ffb020',[
        mkCard({title:'拖拽时周边卡片平滑让位',labels:['orange','red'],
          desc:'用 FLIP 技术：记录旧位置 → 改 DOM → 反向位移归零过渡。',
          subtasks:[{id:uid('s'),title:'实现 FLIP 位移计算',done:true},{id:uid('s'),title:'排除被拖元素自身',done:true},{id:uid('s'),title:'边缘自动滚动',done:false},{id:uid('s'),title:'滚动后重算插入点',done:false}],
          comments:[{id:uid('m'),author:'我',text:'让位动画是这块体验的核心，不能硬闪现。',at:new Date().toISOString()}]}),
        mkCard({title:'详情弹窗从原位置缩放展开',labels:['blue'],due:''}),
        mkCard({title:'边缘自动滚动',labels:['yellow']})
      ]),
      mkList('待评审','#a77bff',[
        mkCard({title:'暗色 / 亮色双主题',labels:['purple','teal'],subtasks:[
          {id:uid('s'),title:'设计令牌抽成 CSS 变量',done:true},{id:uid('s'),title:'背景光晕适配',done:false}]}),
        mkCard({title:'搜索 + 标签筛选联动',labels:['blue']})
      ]),
      mkList('已上线','#3ecf8e',[
        mkCard({title:'localStorage 持久化',labels:['teal']}),
        mkCard({title:'JSON 导入 / 导出',labels:['green'],subtasks:[
          {id:uid('s'),title:'导出快照',done:true},{id:uid('s'),title:'导入校验',done:true}]})
      ])
    ]
  };
  // 示例卡片只保留当前标签表里仍存在的标签（用户删过内置标签时不留悬空引用）
  s.lists.forEach(l=>l.cards.forEach(c=>{ c.labels=(c.labels||[]).filter(k=>labelExists(k)); }));
  return s;
}
/* 标签表：独立于看板数据存储（aurora.labels.v1） */
let labels=[];
function loadLabels(){
  try{
    const raw=localStorage.getItem(LABELS_STORE);
    const d=raw?JSON.parse(raw):null;
    if(Array.isArray(d)&&d.length){
      labels=d.filter(x=>x&&x.id).map(x=>({
        id:String(x.id),
        name:String(x.name||x.id),
        color:/^#[0-9a-fA-F]{6}$/.test(x.color)?x.color:'#7d879c'
      }));
      return;
    }
  }catch(e){}
  labels=loadStandaloneLabels();
  saveLabels();
}
function saveLabels(){
  if(projects.length) return;   // 工单模式下标签随项目文件走，不落 localStorage
  try{ localStorage.setItem(LABELS_STORE,JSON.stringify(labels)); }catch(e){}
}
/** 独立模式（未连工单文件）的标签表 */
function loadStandaloneLabels(){
  try{
    const raw=localStorage.getItem(LABELS_STORE);
    const d=raw?JSON.parse(raw):null;
    if(Array.isArray(d)&&d.length) return d;
  }catch(e){}
  return BUILTIN_LABELS.map(x=>({id:x.id,name:x.name,color:x.color}));
}
function labelDef(id){ return labels.find(l=>l.id===id)||null; }
function labelName(id){ const d=labelDef(id); return d?d.name:id; }
function labelColor(id,fb){ const d=labelDef(id); return d?d.color:(fb||'#7d879c'); }
function labelExists(id){ return !!labelDef(id); }
/* 清掉指向已删除标签的悬空引用（标签被删后卡片不应再挂着无效 id） */
function pruneDanglingLabels(b){
  const t=b||board;
  if(!t||!t.lists) return;
  t.lists.forEach(l=>l.cards.forEach(c=>{
    if(c.labels&&c.labels.length){
      const keep=c.labels.filter(k=>labelExists(k));
      if(keep.length!==c.labels.length) c.labels=keep;
    }
  }));
}
/* 亮度判断：只有确实很浅的底色才改用深色字（阈值取 185，
   正好覆盖内置的黄色 #f5c451，其余内置色维持白字，与卡片 chip 保持一致） */
function isLight(hex){
  const h=String(hex||'').replace('#','');
  if(h.length<6) return false;
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (r*299+g*587+b*114)/1000>185;
}
loadLabels();

/* 独立模式（未连接工单文件）的单看板；工单模式下由 projects 接管 */
let standalone=null;
/* 工单模式：已加载的所有项目，每个项目一份 board.json */
let projects=[];          // [{key,name,color,dirHandle,fileHandle,data,rev}]
let curKey='__all__';     // 当前项目 key；'__all__' = 全部项目聚合视图
let aggBoard=null;        // 聚合视图的临时看板（只读）
let board=null;           // 当前显示的看板 = 聚合视图 或 当前项目

try{
  const raw=localStorage.getItem(STORE);
  const d=raw?JSON.parse(raw):null;
  standalone=(d&&Array.isArray(d.lists)&&d.lists.length)? d : seed();
}catch(e){ standalone=seed(); }
if(!standalone.title) standalone.title='Aurora Board';
board=standalone;
pruneDanglingLabels(standalone);
normalizeStatus(standalone);

/* 旧数据没有 status 字段 → 补默认「待处理」，避免状态筛选把老卡片滤掉 */
function normalizeStatus(b){
  if(!b||!b.lists) return;
  b.lists.forEach(l=>l.cards.forEach(c=>{ if(!STATUSES[c.status]) c.status='todo'; }));
}
function curProject(){
  if(curKey==='__all__') return null;
  return projects.find(p=>p.key===curKey)||null;
}
function save(){
  if(projects.length){
    // 工单模式：写回当前项目文件；聚合视图只读，不写任何地方
    if(!suppressFileWrite){ const p=curProject(); if(p) scheduleFileWrite(p); }
  }else{
    try{ localStorage.setItem(STORE,JSON.stringify(board)); }catch(e){}
  }
  renderRemind();
}
function savePref(){
  try{ localStorage.setItem(PREF,JSON.stringify({theme:document.documentElement.dataset.theme})); }catch(e){}
}
function findList(id){ return board.lists.find(l=>l.id===id); }
function findCard(id){
  for(const l of board.lists){
    const c=l.cards.find(x=>x.id===id);
    if(c) return {card:c,list:l};
  }
  return {card:null,list:null};
}
function allCards(){ return board.lists.flatMap(l=>l.cards); }

/* ============================================================
   渲染
   ============================================================ */
const boardEl=$('#board');
const wrapEl=$('#boardWrap');
const dragLayer=$('#dragLayer');

function cardColor(card){
  return card.labels&&card.labels.length ? labelColor(card.labels[0],'#ff6a3d') : '#ff6a3d';
}
function applyDueState(node,card){
  const s=dueState(card);
  node.classList.remove('due-over','due-today','due-soon');
  if(s) node.classList.add('due-'+s);
  if(node._chip){
    node._chip.textContent=fmtDate(card.due);
    node._chip.className='due-chip'+(s?' due-'+s:'');
  }
}
function buildCard(card){
  const node=el('article','card');
  node.dataset.id=card.id;
  if(card.__proj) node.dataset.proj=card.__proj;   // 聚合视图：记住所属项目
  node.appendChild(el('i','card-fx'));

  const st=statusOf(card);
  if((card.labels&&card.labels.length)||(st!=='todo'&&!card.__proj)){
    const box=el('div','card-labels');
    if(st!=='todo'&&!card.__proj){        // 汇总视图里列名已表达状态，不再重复状态 chip
      const sc=el('span','st-chip',STATUSES[st].name);
      sc.style.color=STATUSES[st].color;
      box.appendChild(sc);
    }
    (card.labels||[]).forEach(k=>{
      const c=labelColor(k);
      const l=el('span','lbl'+(isLight(c)?' dark':''),labelName(k));
      l.style.background=c;
      box.appendChild(l);
    });
    node.appendChild(box);
  }

  const t=el('div','card-title',card.title||'未命名卡片');
  node.appendChild(t);

  if(card.desc){
    const d=el('div','card-desc rd');
    d.innerHTML=renderRich(card.desc,'card');
    node.appendChild(d);
  }

  const done=(card.subtasks||[]).filter(s=>s.done).length;
  const total=(card.subtasks||[]).length;
  const cmt=(card.comments||[]).length;
  if(card.due||total||cmt){
    const meta=el('div','card-meta');
    if(card.due){
      const m=el('span','meta');
      m.appendChild(svg(['M8 2v4M16 2v4','M3 10h18','M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z']));
      const chip=el('span','due-chip',fmtDate(card.due));
      m.appendChild(chip);
      node._chip=chip;
      meta.appendChild(m);
    }
    if(total){
      const m=el('span','meta '+(done===total?'done':''));
      m.appendChild(svg(['M9 11l3 3L22 4','M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11']));
      m.appendChild(el('span',null,done+'/'+total));
      meta.appendChild(m);
    }
    if(cmt){
      const m=el('span','meta');
      m.appendChild(svg(['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z']));
      m.appendChild(el('span',null,String(cmt)));
      meta.appendChild(m);
    }
    node.appendChild(meta);
  }

  if(total){
    const p=el('div','card-prog');
    const i=el('i'); i.style.width=(total?done/total*100:0)+'%';
    p.appendChild(i); node.appendChild(p);
  }
  applyDueState(node,card);
  return node;
}

   筛选
   ============================================================ */
let query='', activeLabels=new Set(), activeStatus=new Set();
/* 状态筛选：点「待复查」即进入复查工作台 —— 跨所有项目列筛出待复查的卡片 */
function renderStatusChips(){
  const box=$('#statusChips');
  box.innerHTML='';
  box.appendChild(el('span','filter-label','状态'));
  STATUS_KEYS.forEach(k=>{
    const s=STATUSES[k];
    const b=el('button','fc');
    const d=el('span','dot'); d.style.background=s.color;
    b.append(d,el('span',null,s.name));
    if(activeStatus.has(k)){ b.classList.add('on'); b.style.background=s.color; }
    b.addEventListener('click',()=>{
      if(activeStatus.has(k)) activeStatus.delete(k); else activeStatus.add(k);
      renderStatusChips(); applyFilter();
    });
    box.appendChild(b);
  });
  if(activeStatus.size){
    const clr=el('button','fc','清除');
    clr.addEventListener('click',()=>{activeStatus.clear();renderStatusChips();applyFilter();});
    box.appendChild(clr);
  }
}
function renderFilterChips(){
  const box=$('#filterChips');
  box.innerHTML='';
  box.appendChild(el('span','filter-label','标签'));
  const used=new Set();
  allCards().forEach(c=>(c.labels||[]).forEach(k=>used.add(k)));
  if(!used.size){
    box.appendChild(el('span','filter-label','（暂无）'));
    return;
  }
  // 顺序跟随「管理标签」面板：内置标签保持色板顺序，自建标签按创建顺序追加
  // （不依赖 localeCompare 的中文排序，各浏览器 collation 差异大、顺序不符合直觉）
  labels.forEach(l=>{
    if(!used.has(l.id)) return;
    const b=el('button','fc');
    const d=el('span','dot'); d.style.background=l.color;
    b.append(d,el('span',null,l.name));
    if(activeLabels.has(l.id)){ b.classList.add('on'); b.style.background=l.color; }
    b.addEventListener('click',()=>{
      if(activeLabels.has(l.id)) activeLabels.delete(l.id); else activeLabels.add(l.id);
      renderFilterChips(); applyFilter();
    });
    box.appendChild(b);
  });
  if(activeLabels.size){
    const clr=el('button','fc','清除');
    clr.addEventListener('click',()=>{activeLabels.clear();renderFilterChips();applyFilter();});
    box.appendChild(clr);
  }
}
function matchCard(c){
  if(activeStatus.size&&!activeStatus.has(statusOf(c))) return false;
  if(activeLabels.size){
    for(const k of activeLabels) if(!(c.labels||[]).includes(k)) return false;
  }
  if(query){
    const q=query.toLowerCase();
    const hay=[c.title,c.desc,(c.subtasks||[]).map(s=>s.title).join(' '),(c.comments||[]).map(x=>x.text).join(' ')].join(' ').toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function applyFilterTo(node,c){ node.classList.toggle('hidden',!matchCard(c)); }
function applyFilter(){
  board.lists.forEach(l=>{
    const body=boardEl.querySelector('.list[data-id="'+l.id+'"] .list-body');
    if(!body) return;
    Array.from(body.children).forEach((node,i)=>applyFilterTo(node,l.cards[i]));
  });
}
$('#search').addEventListener('input',e=>{
  query=e.target.value.trim();
  $('#searchBox').classList.toggle('has',!!query);
  applyFilter();
});
$('#searchClear').addEventListener('click',()=>{
  query=''; $('#search').value=''; $('#searchBox').classList.remove('has'); applyFilter();
});

/* ============================================================
   富文本描述（Markdown 子集）+ 图片存储
   ============================================================ */
const IDB_NAME='aurora-media', IDB_STORE='imgs';
let idbPromise=null;
const imgCache=new Map();   // 图片 id → dataURL（内存缓存，渲染时同步取用）

function idb(){
  if(!idbPromise) idbPromise=new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,2);
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return idbPromise;
}
async function metaSet(k,v){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('meta','readwrite');
    tx.objectStore('meta').put(v,k);
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}
async function metaGet(k){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('meta','readonly');
    const q=tx.objectStore('meta').get(k);
    q.onsuccess=()=>res(q.result||null);
    q.onerror=()=>rej(tx.error);
  });
}
async function idbPut(id,rec){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(rec,id);
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const q=tx.objectStore(IDB_STORE).get(id);
    q.onsuccess=()=>res(q.result||null);
    q.onerror=()=>rej(tx.error);
  });
}
async function idbAll(){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const st=tx.objectStore(IDB_STORE);
    const kq=st.getAllKeys(), vq=st.getAll();
    tx.oncomplete=()=>{ const m={}; kq.result.forEach((k,i)=>{ m[k]=vq.result[i]; }); res(m); };
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbDel(id){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
  });
}
async function loadImages(){
  try{
    const all=await idbAll();
    Object.keys(all).forEach(k=>{ const r=all[k]; if(r&&r.data) imgCache.set(k,r.data); });
  }catch(e){}
}
/* 图片压缩：canvas 缩放 + JPEG 编码。截图类图片不含透明通道，白底填充安全 */
function compressImage(file,maxSide,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('读取失败'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('图片解码失败'));
      im.onload=()=>{
        let w=im.width,h=im.height;
        const sc=Math.min(1,(maxSide||1600)/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(im,0,0,w,h);
        try{ res(cv.toDataURL('image/jpeg',q||0.82)); }catch(e){ rej(e); }
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function storeImage(file){
  const data=await compressImage(file);
  const id='img_'+uid('x');
  await idbPut(id,{mime:'image/jpeg',data:data});
  imgCache.set(id,data);
  return id;
}
/* 被描述引用的图片 id（b 缺省为当前看板） */
function collectImageIds(b){
  const src=b||board;
  const ids=new Set();
  const re=/!\[[^\]]*\]\(img:([A-Za-z0-9_-]+)\)/g;
  ((src&&src.lists)||[]).forEach(l=>(l.cards||[]).forEach(c=>{
    const s=c.desc||'';
    let m;
    while((m=re.exec(s))) ids.add(m[1]);
  }));
  return Array.from(ids);
}
async function gcImages(){
  const used=new Set(collectImageIds());
  for(const k of Array.from(imgCache.keys())){
    if(used.has(k)) continue;
    imgCache.delete(k);
    try{ await idbDel(k); }catch(e){}
  }
}
/* ---------------- Markdown 子集 → 受控 HTML ----------------
   安全模型：用户文本先整体 HTML 转义，再在转义后的文本上做结构化替换，
   所有标签与属性都由本模块生成 → 用户内容无法逃逸成标签。
   因此这里用 innerHTML 落地是安全的（不要改成直接塞用户原文）。 */
function escHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeLinkUrl(u){
  const s=String(u||'').trim();
  return /^(https?:|mailto:)/i.test(s)?s:'';
}
function safeImgUrl(u){
  const s=String(u||'').trim();
  if(/^img:[A-Za-z0-9_-]+$/.test(s)) return s;
  return /^https?:\/\//i.test(s)?s:'';
}
function imgHtml(alt,u){
  const url=safeImgUrl(u);
  if(!url) return '<span class="rd-bad">[图片不可用]</span>';
  if(url.slice(0,4)==='img:'){
    const d=imgCache.get(url.slice(4));
    if(!d) return '<span class="rd-bad">[图片缺失]</span>';
    return '<img src="'+d+'" alt="'+alt+'" loading="lazy">';
  }
  return '<img src="'+url+'" alt="'+alt+'" loading="lazy" referrerpolicy="no-referrer">';
}
function linkHtml(text,u){
  const url=safeLinkUrl(u);
  return url?'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+text+'</a>':text;
}
function inlineMd(s){
  let x=String(s==null?'':s);
  const codes=[];
  x=x.replace(/`([^`]+)`/g,(m,c)=>{ codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  x=x.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>imgHtml(a,u));
  x=x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>linkHtml(t,u));
  x=x.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  x=x.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  x=x.replace(/\n/g,'<br>');
  x=x.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[+i]+'</code>');
  return x;
}
function mdToHtml(src){
  const lines=escHtml(String(src||'').replace(/\u0000/g,'')).split(/\r?\n/);
  const out=[];
  let i=0, listType=null;
  const closeList=()=>{ if(listType){ out.push('</'+listType+'>'); listType=null; } };
  while(i<lines.length){
    const line=lines[i];
    if(!line.trim()){ closeList(); i++; continue; }
    let m=line.match(/^(#{1,4})\s+(.*)$/);
    if(m){ closeList(); const lv=Math.min(6,m[1].length+2); out.push('<h'+lv+'>'+inlineMd(m[2])+'</h'+lv+'>'); i++; continue; }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ closeList(); out.push('<hr>'); i++; continue; }
    if(/^\s*&gt;\s?/.test(line)){
      closeList();
      const buf=[];
      while(i<lines.length && /^\s*&gt;\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*&gt;\s?/,'')); i++; }
      out.push('<blockquote>'+inlineMd(buf.join('\n'))+'</blockquote>');
      continue;
    }
    m=line.match(/^\s*([-*+])\s+(.*)$/);
    if(m){
      if(listType!=='ul'){ closeList(); out.push('<ul>'); listType='ul'; }
      out.push('<li>'+inlineMd(m[2])+'</li>'); i++; continue;
    }
    m=line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(m){
      if(listType!=='ol'){ closeList(); out.push('<ol>'); listType='ol'; }
      out.push('<li>'+inlineMd(m[1])+'</li>'); i++; continue;
    }
    closeList();
    const buf=[line]; i++;
    while(i<lines.length && lines[i].trim() && !/^\s*(#{1,4}\s|[-*+]\s|\d+[.)]\s|&gt;)/.test(lines[i])){ buf.push(lines[i]); i++; }
    out.push('<p>'+inlineMd(buf.join('\n'))+'</p>');
  }
  closeList();
  return out.join('');
}
/* mode:'card' → 图片提到最前、缩略图展示；'full' → 保持原序完整展示 */
function renderRich(src,mode){
  let html=mdToHtml(src);
  if(mode==='card'){
    const imgs=[];
    html=html.replace(/<img\b[^>]*>/g,m=>{ imgs.push(m); return ''; });
    html=html.replace(/<p>\s*<\/p>/g,'');
    if(imgs.length) html='<div class="rd-imgs">'+imgs.join('')+'</div>'+html;
  }
  return html;
}
function updateDescView(){

function insertAtCursor(ta,text){
  const s=ta.selectionStart||0, e=ta.selectionEnd||0;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.focus();
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}

/* ============================================================
   FLIP 让位动画
   ============================================================ */
function snapshot(sel){
  const m={};
  Array.from(document.querySelectorAll(sel)).forEach(n=>{
    if(n.classList.contains('is-source')||n.classList.contains('hidden')) return;
    const r=n.getBoundingClientRect();
    m[n.dataset.id||n]=r;
  });
  return m;
}
function playFlip(prev,sel){
  if(document.body.classList.contains('no-anim')) return;
  Array.from(document.querySelectorAll(sel)).forEach(n=>{
    if(n.classList.contains('is-source')||n.classList.contains('hidden')) return;
    const p=prev[n.dataset.id||n];
    if(!p) return;
    const r=n.getBoundingClientRect();
    const dx=p.left-r.left, dy=p.top-r.top;
    if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return;
    n.style.transition='none';
    n.style.transform='translate('+dx+'px,'+dy+'px)';
  });
  if(!Object.keys(prev).length) return;
  void document.body.offsetWidth;
  Array.from(document.querySelectorAll(sel)).forEach(n=>{
    if(n.classList.contains('is-source')||n.classList.contains('hidden')) return;
    if(!prev[n.dataset.id||n]) return;
    n.style.transition='transform .28s cubic-bezier(.22,1,.36,1)';
    n.style.transform='';
  });
}

/* ============================================================
   菜单 / 气泡
   ============================================================ */
const menuEl=$('#menu');
let menuCloser=null;
function closeMenu(){
  menuEl.classList.remove('show');
  if(menuCloser){ menuCloser(); menuCloser=null; }
}
function openMenu(anchor,items){
  const custom=items.custom;
  menuEl.innerHTML='';
  items.list.forEach(it=>{
    if(it==='-'){ menuEl.appendChild(el('hr')); return; }
    const b=el('button',it.danger?'danger':'');
    if(it.icon) b.appendChild(it.icon()); else b.appendChild(el('span',null,''));
    b.appendChild(el('span',null,it.label));
    b.addEventListener('click',()=>{ closeMenu(); it.onClick&&it.onClick(); });
    menuEl.appendChild(b);
  });
  if(custom) custom(menuEl);
  menuEl.classList.add('show');
  const r=anchor.getBoundingClientRect();
  const mw=menuEl.offsetWidth, mh=menuEl.offsetHeight;

/* ============================================================
   拖拽引擎（Pointer Events + FLIP）
   ============================================================ */
let drag=null;
let suppressClick=false;
let px=0,py=0;

wrapEl.addEventListener('pointerdown',onDown);

function onDown(e){
  if(e.button!==0) return;
  if(curKey==='__all__') return;          // 「全部项目」是只读汇总视图，不参与拖拽
  if(e.target.closest('button')||e.target.closest('.icon-btn')) return;
  if(e.target.closest('[contenteditable="true"]')) return;
  const card=e.target.closest('.card');
  const header=e.target.closest('.list-header');
  if(!card&&!header) return;
  drag={
    type: card?'card':'list',
    id: card?card.dataset.id:header.closest('.list').dataset.id,
    node: card||header.closest('.list'),
    sx:e.clientX, sy:e.clientY, started:false, ghost:null, moved:false
  };
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
  document.addEventListener('pointercancel',onUp);
}

function activate(){
  const d=drag;
  d.started=true;
  document.body.classList.add('dragging');
  document.body.style.cursor='grabbing';
  document.body.style.userSelect='none';
  if(d.type==='card'){
    const r=d.node.getBoundingClientRect();
    d.offX=px-r.left;
    d.offY=py-r.top;
    const g=d.node.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('is-source');
    g.style.width=r.width+'px';
    g.style.height=r.height+'px';
    g.style.transition='none';
    g.style.animation='none';
    dragLayer.appendChild(g);
    d.ghost=g;
    d.node.classList.add('is-source');
    if(window.innerWidth<760) d.ghost.style.display='none';
  }else{
    const r=d.node.getBoundingClientRect();
    d.offX=px-r.left;
    d.offY=py-r.top;
    const g=d.node.cloneNode(true);
    g.classList.add('ghost');
    g.classList.remove('is-source');
    g.style.width=r.width+'px';
    g.style.height=r.height+'px';
    g.style.transition='none';
    g.style.animation='none';
    dragLayer.appendChild(g);
    d.ghost=g;
    d.node.classList.add('is-source');
  }
}

function onMove(e){
  px=e.clientX; py=e.clientY;
  if(!drag) return;
  if(!drag.started){
    if(Math.abs(px-drag.sx)<5&&Math.abs(py-drag.sy)<5) return;
    activate();
    drag.moved=true;
  }
  e.preventDefault();
  if(drag.type==='card'){
    drag.ghost.style.transform='translate('+(px-drag.offX)+'px,'+(py-drag.offY)+'px) rotate(2.6deg) scale(1.03)';
    updateAutoScroll();
    placeCard();
  }else{
    const sb=drag.node.querySelector('.list-body');
    const gb=drag.ghost.querySelector('.list-body');
    if(sb&&gb) gb.scrollTop=sb.scrollTop;
    drag.ghost.style.transform='translate('+(px-drag.offX)+'px,'+(py-drag.offY)+'px) rotate(-1.6deg) scale(1.02)';
    updateAutoScroll();
    placeList();
  }
}
function onUp(){
  document.removeEventListener('pointermove',onMove);
  document.removeEventListener('pointerup',onUp);
  document.removeEventListener('pointercancel',onUp);
  stopAutoScroll();
  const d=drag;
  drag=null;
  document.body.classList.remove('dragging');
  document.body.style.cursor='';
  document.body.style.userSelect='';
  if(!d) return;
  if(d.ghost) d.ghost.remove();
  if(!d.started) return;
  d.node.classList.remove('is-source');
  if(d.moved){
    syncFromDom();
    board.lists.forEach(l=>updateListMeta(l.id));
    save();
    renderStats(); renderFilterChips(); applyFilter();
  }
  suppressClick=true;
  setTimeout(()=>suppressClick=false,60);
}

/* 卡片落点：跨列 + 同列排序 */
function listUnderPointer(){
  const lists=Array.from(boardEl.querySelectorAll('.list'));
  for(const l of lists){
    const r=l.querySelector('.list-body').getBoundingClientRect();
    if(px>=r.left-6&&px<=r.right+6&&py>=r.top-26&&py<=r.bottom+26) return l;
  }
  return null;
}
function placeCard(){
  const src=drag.node;
  const target=listUnderPointer();
  if(!target) return;
  const body=target.querySelector('.list-body');
  const kids=Array.from(body.querySelectorAll('.card')).filter(k=>k!==src);
  let idx=kids.length;
  for(let i=0;i<kids.length;i++){
    const r=kids[i].getBoundingClientRect();
    if(py<r.top+r.height/2){ idx=i; break; }
  }
  const curIdx=Array.prototype.indexOf.call(body.children,src);
  if(curIdx===idx) return;
  const prev=snapshot('.card');
  body.insertBefore(src, kids[idx]||null);
  playFlip(prev,'.card');
  $$('.list').forEach(l=>l.classList.toggle('drop-target',l===target));
}

/* 列表落点：横向换位（仅在 .list 之间判定，忽略"添加列表"按钮） */
function placeList(){
  const src=drag.node;
  const lists=Array.from(boardEl.querySelectorAll('.list'));
  let target=null,before=true;
  for(const l of lists){
    if(l===src) continue;
    const r=l.getBoundingClientRect();
    if(px>r.left-6&&px<r.right+6){
      target=l; before=px<r.left+r.width/2; break;
    }
  }
  if(!target){
    const first=lists[0], last=lists[lists.length-1];
    if(last&&last!==src&&px>last.getBoundingClientRect().right+2){ target=last; before=false; }
    else if(first&&first!==src&&px<first.getBoundingClientRect().left-2){ target=first; before=true; }
  }
  if(!target) return;
  const ref=before?target:target.nextElementSibling;
  if(ref===src) return;
  if(src.nextElementSibling===ref) return;
  const prev=snapshot('.list');
  boardEl.insertBefore(src,ref);
  playFlip(prev,'.list');
}

/* 边缘自动滚动 */
let asRaf=null,asX=0,asY=0,asList=null;
function updateAutoScroll(){
  const wr=wrapEl.getBoundingClientRect();
  const edge=88,max=17;
  asX=0;asY=0;
  if(px<wr.left+edge) asX=-Math.ceil((wr.left+edge-px)/edge*max);
  else if(px>wr.right-edge) asX=Math.ceil((px-(wr.right-edge))/edge*max);
  asList=drag&&drag.type==='card'?listUnderPointer():null;
  if(asList){
    const br=asList.querySelector('.list-body').getBoundingClientRect();
    if(py<br.top+46) asY=-Math.ceil((br.top+46-py)/46*max);
    else if(py>br.bottom-46) asY=Math.ceil((py-(br.bottom-46))/46*max);
  }
  if(!asX&&!asY){ stopAutoScroll(); return; }
  if(!asRaf){
    const tick=()=>{
      if(asX) wrapEl.scrollLeft+=asX;
      if(asY&&asList&&document.body.contains(asList)){
        asList.querySelector('.list-body').scrollTop+=asY;
        if(drag&&drag.type==='card') placeCard();
      } else if(asY&&drag&&drag.type==='list'){
        wrapEl.scrollTop+=asY;
      }
      asRaf=requestAnimationFrame(tick);
    };
    asRaf=requestAnimationFrame(tick);
  }
}
function stopAutoScroll(){ if(asRaf){cancelAnimationFrame(asRaf);asRaf=null;} asX=0;asY=0;asList=null; }

/* DOM → 数据（按 DOM 顺序重建，跨列移动也能正确登记） */
function syncFromDom(){
  const globalMap={};
  board.lists.forEach(l=>l.cards.forEach(c=>{ globalMap[c.id]=c; }));
  const listEls=Array.from(boardEl.querySelectorAll('.list'));
  const next=[];
  listEls.forEach(le=>{
    const l=findList(le.dataset.id);
    if(!l) return;
    l.cards=Array.from(le.querySelectorAll('.list-body > .card'))
      .map(ce=>globalMap[ce.dataset.id])
      .filter(Boolean);
    next.push(l);
  });
  board.lists=next;
}

function renderSubtasks(card){
  const list=$('#stList');
  list.innerHTML='';
  const arr=card.subtasks||[];
  const done=arr.filter(s=>s.done).length;
  const total=arr.length;
  const pct=total?Math.round(done/total*100):0;
  $('#stCount').textContent=total?('('+done+'/'+total+')'):'';
  const barBox=$('#stBar').parentElement;
  barBox.style.display=total?'':'none';
  $('#stPct').style.display=total?'':'none';
  $('#stBar').style.width=pct+'%';
  $('#stPct').textContent=total?(pct+'% 完成'):'';
  if(!total){
    list.appendChild(el('div','empty-tip','还没有子任务，从下面添加一条'));
    return;
  }
  arr.forEach((s,i)=>{
    const row=el('div','st'+(s.done?' done':''));
    row.dataset.sid=s.id;
    row.style.animationDelay=(i*22)+'ms';
    const box=el('button','box');
    box.appendChild(svg(['M20 6L9 17l-5-5'],{sw:'3'}));
    box.addEventListener('click',()=>{
      s.done=!s.done; save();
      row.classList.toggle('done',s.done);
      renderSubtasks(card); refreshCardEl(card); updateListMeta(findCard(modalCtx.cardId).list.id);
    });
    const txt=el('div','st-t',s.title);
    txt.addEventListener('dblclick',()=>{
      txt.contentEditable='true'; txt.focus();
      const rng=document.createRange(); rng.selectNodeContents(txt);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);
      const commit=()=>{
        txt.contentEditable='false';
        s.title=txt.textContent.trim()||'未命名子任务'; txt.textContent=s.title;
        save(); refreshCardEl(card);
      };
      txt.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();txt.blur();} },{once:true});
      txt.addEventListener('blur',commit,{once:true});
    });
    const x=el('button','st-x');
    x.appendChild(svg(['M18 6L6 18M6 6l12 12'],{sw:'2.4'}));
    x.addEventListener('click',()=>{
      card.subtasks=card.subtasks.filter(t=>t.id!==s.id);
      save(); renderSubtasks(card); refreshCardEl(card); updateListMeta(findCard(modalCtx.cardId).list.id);
    });
    row.append(box,txt,x);
    list.appendChild(row);
  });
}

/* ============================================================
   截止日期提醒
   ============================================================ */
const remindBtn=$('#remindBtn');
const remindPanel=$('#remindPanel');
const remindBody=$('#remindBody');

function dueBuckets(){
  const over=[],today=[],soon=[];
  board.lists.forEach(l=>l.cards.forEach(c=>{
    if(!c||!c.due) return;
    const s=dueState(c);
    if(s==='over') over.push({c:c,l:l});
    else if(s==='today') today.push({c:c,l:l});
    else if(s==='soon') soon.push({c:c,l:l});
  }));
  // 逾期按到期日升序（越早逾期越靠前）；临期同理（越早到期越靠前）。
  // due 是 ISO 日期串，字典序即时间序，可直接比较。
  over.sort((a,b)=>a.c.due<b.c.due?-1:1);
  soon.sort((a,b)=>a.c.due<b.c.due?-1:1);
  return {over:over,today:today,soon:soon};
}
function renderRemind(){
  if(typeof board==='undefined'||!board||!remindBtn) return;
  const b=dueBuckets();
  const urgent=b.over.length+b.today.length;
  const total=urgent+b.soon.length;
  const cnt=$('#remindCount');
  cnt.textContent=String(urgent);
  cnt.hidden=urgent===0;
  remindBtn.classList.toggle('alert',urgent>0);
  remindBtn.title=urgent?('截止日期提醒：'+urgent+' 张需立即处理'):'截止日期提醒';
  $('#remindSub').textContent=total?('共 '+total+' 张'):'';

  const keepTop=remindPanel.scrollTop;
  remindBody.innerHTML='';
  if(!total){
    remindBody.appendChild(el('div','remind-empty','暂无到期的卡片'));
  }else{
    const group=(title,color,items)=>{
      const g=el('div','rgroup');
      const h=el('div','rg-h');
      const d=el('span','dot'); d.style.background=color;
      h.append(d,el('span',null,title),el('b',null,String(items.length)));
      g.appendChild(h);
      items.forEach(it=>{
        const btn=el('button','ritem');
        btn.appendChild(el('span','ri-t',it.c.title||'未命名卡片'));
        const s=el('span','ri-s');
        const ld=el('span','ldot'); ld.style.background=it.l.color;
        s.append(ld,el('span','lname',it.l.title),el('span',null,'· '+fmtDate(it.c.due)));
        btn.appendChild(s);
        btn.addEventListener('click',()=>gotoCard(it.c.id));
        g.appendChild(btn);
      });
      remindBody.appendChild(g);
    };
    if(b.over.length) group('逾期','#ff5c5c',b.over);
    if(b.today.length) group('今天到期','#ff8a3d',b.today);
    if(b.soon.length) group('即将到期（'+DUE_SOON_DAYS+' 天内）','#ffb020',b.soon);
  }
  remindPanel.scrollTop=keepTop;
}
function openRemind(){
  renderRemind();
  remindPanel.classList.add('show');
  const r=remindBtn.getBoundingClientRect();
  const w=remindPanel.offsetWidth,h=remindPanel.offsetHeight;
  let left=Math.min(r.right-w,window.innerWidth-w-12);
  // 铃铛在顶栏第一行，面板若从铃铛正下方展开会横跨第二行，

  const tb=document.querySelector('.topbar').getBoundingClientRect();

/* ============================================================
   本地文件桥（agent 工单流的通道）
   两种接入：
   ① 工单根目录（推荐）：showDirectoryPicker 选一个根目录，其下每个子目录
      视为一个项目、子目录里的 board.json 即该项目的工单文件。
      一次授权即可看到全部项目，并提供「全部项目」聚合视图（按状态分列）。
   ② 多文件：showOpenFilePicker 可多选，跨目录跨盘都行。
   双向同步判据是修订号 rev：只有 rev 更大的一方才会覆盖另一方，避免互相踩。
   ============================================================ */
const FILE_REV_KEY='aurora.rev.v1';
const FILE_HANDLE_KEY='fileHandle';
const DIR_HANDLE_KEY='dirHandle';
/** agent 读工单文件的固定约定：根目录\<项目名>\board.json */
const BOARDS_ROOT='C:\\Users\\yutue\\boards';
const SYNC_HINT='工单文件约定：'+BOARDS_ROOT+'\\<项目名>\\board.json';
let dirHandle=null;              // 目录模式
let fileHandles=[];              // 文件模式（可多选）
let fileSyncOn=false, pendingHandle=null, pendingDir=null;
let fileWriteTimer=null, localRev=0, suppressFileWrite=false;
const ROOT_PATH_KEY='aurora.boardsroot.v1';

/** 工单根目录的绝对路径（浏览器拿不到目录句柄的绝对路径，只能由用户确认一次） */
function boardsRoot(){
  try{ const v=localStorage.getItem(ROOT_PATH_KEY); if(v) return v; }catch(e){}
  return BOARDS_ROOT;
}
